    <div id="root"></div>

    <!-- Luxury Interactive Hover & Cursor Glow Engine -->
    <div id="luxury-mouse-glow" style="left: -999px; top: -999px;"></div>
    <script>
      (function() {
        const glow = document.getElementById('luxury-mouse-glow');
        if (!glow) return;
        let mouseX = -999, mouseY = -999;
        let currentX = -999, currentY = -999;

        window.addEventListener('mousemove', function(e) {
          mouseX = e.clientX;
          mouseY = e.clientY;
        }, { passive: true });

        function renderGlow() {
          if (mouseX > -100) {
            currentX += (mouseX - currentX) * 0.15;
            currentY += (mouseY - currentY) * 0.15;
            glow.style.left = currentX + 'px';
            glow.style.top = currentY + 'px';
          }
          requestAnimationFrame(renderGlow);
        }
        requestAnimationFrame(renderGlow);

        document.addEventListener('mouseover', function(e) {
          var target = e.target.closest('a, button, img, h1, h2, h3, h4, [class*="rounded-full"], span[class*="px-"]');
          if (target) {
            glow.style.width = '520px';
            glow.style.height = '520px';
            glow.style.background = 'radial-gradient(circle, rgba(197, 160, 89, 0.22) 0%, rgba(80, 227, 100, 0.08) 45%, transparent 70%)';
          } else {
            glow.style.width = '380px';
            glow.style.height = '380px';
            glow.style.background = 'radial-gradient(circle, rgba(197, 160, 89, 0.12) 0%, rgba(80, 227, 100, 0.04) 40%, transparent 70%)';
          }
        });
      })();
    </script>
